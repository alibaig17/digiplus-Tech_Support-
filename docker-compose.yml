version: "3.9"

# NOTE: This stack uses MongoDB Atlas (cloud) as configured in backend/.env —
# no local Mongo container is included. Set MONGODB_URI in backend/.env
# before running `docker compose up`.

services:
  backend:
    build: ./backend
    container_name: ai-support-copilot-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_data:/app/chroma_data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-support-copilot-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
